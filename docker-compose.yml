services:
  web:
    build: .
    container_name: http_zelda
    environment:
      ADDR: ${ADDR}
      DB_HOST: ${DOCKER_DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSLMODE: ${DB_SSLMODE}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16.3
    container_name: postgres_server
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./cmd/migrate/000001_status.up.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,z
      - ./scripts/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro,z
      - ./codes.csv:/seed/codes.csv:ro,z
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 10

  proxy:
    image: nginx:1.31-alpine
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          selinux: z
    ports:
      - 8080:80
    depends_on:
      - web

volumes:
  postgres_data:
