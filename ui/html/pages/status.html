{{define "styles"}}
    <link rel="stylesheet" href="/static/css/status.css">
{{end}}

{{define "title"}}{{.Status.Code}} {{.Status.Phrase}}{{end}}

{{define "main"}}
    <div class="status-detail">

        <div class="status-detail-header">
            <h2><span class="code">{{.Status.Code}}</span> {{.Status.Phrase}}</h2>
            <img src="/static/img/{{.Status.Code}}.jpg" alt="{{.Status.Code}} {{.Status.Phrase}}">
        </div>

        <div class="status-detail-body">
            <h3>{{.Status.Title}}</h3>
            <p>{{.Status.Content}}</p>
        </div>

        <div class="status-detail-meaning">
            <h3>Meaning</h3>
            <p>{{.Status.Meaning}}</p>
        </div>

        <a class="back" href="/">← Back</a>

    </div>
{{end}}
