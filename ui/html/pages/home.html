{{define "css"}}
    <link rel="stylesheet" href="/static/css/home.css">
{{end}}
{{define "title"}}
    HTTP Zelda
{{end}}

{{define "main"}}
    <p><span>Note:</span> Click <a href="/">here</a> to see a tip to remember http status codes</p>

    <div class="container-status">
        {{range .}}
        <div class="status">
            <a href="/status/{{.Code}}">
                <img src="/static/img/{{.Code}}.jpg" alt="">
            </a>
            <div class="status-info">
                <p>{{.Code}}</p>  
                <p>{{.Phrase}}</p>            
            </div>
        </div>
        {{end}}
         
    </div>
{{end}}

{{define "footer"}}
    <p>&copy; 2026</p>
{{end}}
